[package]
name = "voiceforge"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
rodio = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
toml = "0.8"
toml_edit = "0.22"

[dev-dependencies]
hound = "3"
serial_test = "3"
tempfile = "3"
