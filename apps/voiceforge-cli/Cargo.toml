[package]
name = "voiceforge"
version = "0.4.0"
edition = "2021"
build = "build.rs"

[build-dependencies]
# sha256 the embedded runtime scripts at compile time. Same crate
# version as the runtime [dependencies] entry; build-deps are
# compiled separately (host target) but the version is already in
# the lockfile so no extra resolver work.
sha2 = "0.10"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
# Explicit rustls-tls (not platform-default) + stream feature for the
# tarball download. ROADMAP 6.2 install-pack does single-pass sha256
# over a chunked body via tokio_util::io::StreamReader + copy_buf.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rodio = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
toml = "0.8"
toml_edit = "0.22"
thiserror = "1"
tar = "0.4"
flate2 = "1"
fs2 = "0.4"
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
# `which::which` for testable PATH lookup of yt-dlp (URL ingest, ROADMAP 2.3).
# Default features include `regex` -- not needed; disable to keep tree slim.
which = { version = "6", default-features = false }
tempfile = "3"
# Read the post-ingest WAV for the silence-rejection RMS pass
# (ROADMAP 2.2.1). Was a dev-dep; promoted to runtime.
hound = "3"
# voiceforge watch <path> (ROADMAP 3.4) — cross-platform fs events
# (FSEvents on macOS, inotify on Linux, ReadDirectoryChangesW on
# Windows). debouncer-mini coalesces bursts; globset filters paths.
notify = "8"
notify-debouncer-mini = "0.7"
globset = "0.4"
# `voiceforge`'s ReactionProvider trait needs `Arc<dyn ReactionProvider>`
# for runtime selection (Static vs Llm). RPITIT (`-> impl Future + Send`)
# is not dyn-compatible on stable; async-trait generates the Pin<Box<dyn
# Future + Send>> adapter. One Box per call is rounding error against a
# 500-3000ms LLM round-trip (ROADMAP 4.1).
async-trait = "0.1.89"
# ROADMAP v0.4 PR-AB step 5.5 — Tier-1 branding.
# owo-colors ANSI 24-bit truecolor; `supports-colors` feature enables
# the `if_supports_color()` adapter which respects NO_COLOR + TTY so
# we don't need a hand-rolled guard. terminal_size for width detection
# (degrade big banner to compact under 60 cols).
owo-colors = { version = "4", features = ["supports-colors"] }
terminal_size = "0.4"
# ROADMAP v0.4 PR-AB step 6b — Tier-2 install wizard.
# indicatif drives the MultiProgress that the v2 install script's
# `==> ` phase lines feed into. Same crate the rest of the Rust
# ecosystem standardizes on for CLI progress; respects NO_COLOR
# and !TTY automatically (no double-render with our branding gate).
indicatif = "0.17"
# v0.4 PR-D — voiceforge note CLI. CommonMark parser for the .md
# input path. Streaming event API + zero transitive deps the project
# doesn't already have. Hand-rolled regex was rejected by rust-expert
# review as a "40 LoC bug factory" given the prose-correctness
# requirements of the audiobook demo.
pulldown-cmark = { version = "0.10", default-features = false }

[dev-dependencies]
hound = "3"
serial_test = "3"
tempfile = "3"
mockito = "1"
