name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Default GITHUB_TOKEN is too broad; this workflow only reads source.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path apps/voiceforge-cli/Cargo.toml --all -- --check

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          shopt -s nullglob
          # nullglob makes scripts/*.sh expand to empty when no matches;
          # install.sh is a literal token (it'll be a real glob once 1.5
          # ships) so we test for it explicitly.
          targets=(scripts/*.sh)
          if [ -f install.sh ]; then
            targets+=(install.sh)
          fi
          if [ ${#targets[@]} -eq 0 ]; then
            echo "no shell scripts to check"
            exit 0
          fi
          # SC1091: 'Not following sourced file' is expected for
          # runtime-created venvs (.venv/bin/activate). Other infos
          # stay enabled.
          shellcheck -e SC1091 "${targets[@]}"

  rust:
    name: clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/voiceforge-cli

      - name: install system deps (ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libasound2-dev: rodio -> alsa-sys needs alsa.pc
          # ffmpeg: fixture transcode + audio_ingest tests
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libasound2-dev \
            pkg-config
          pipx install 'yt-dlp==2026.2.4'

      - name: install ffmpeg + yt-dlp (macos)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg yt-dlp

      - name: cache test fixtures
        id: fixture-cache
        uses: actions/cache@v4
        with:
          path: tests/fixtures
          key: fixtures-${{ runner.os }}-synthetic-${{ hashFiles('scripts/fetch_fixtures.sh') }}

      - name: generate synthetic test fixtures
        if: steps.fixture-cache.outputs.cache-hit != 'true'
        # CI uses synthetic (sine wave) instead of YouTube — shared
        # runner egress IPs hit YouTube's bot detection. The audio_ingest
        # tests only assert format/duration; content doesn't matter.
        # Local dev still uses 'youtube' mode by default to hear the
        # actual Peter Griffin clip.
        env:
          FIXTURE_MODE: synthetic
        run: bash scripts/fetch_fixtures.sh

      - name: clippy
        run: cargo clippy --manifest-path apps/voiceforge-cli/Cargo.toml --all-targets --all-features -- -D warnings

      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --manifest-path apps/voiceforge-cli/Cargo.toml --no-deps --all-features

      - name: test
        env:
          VOICEFORGE_REQUIRE_FIXTURES: "1"
        run: cargo test --manifest-path apps/voiceforge-cli/Cargo.toml --all-features

      - name: install.sh smoke (dry-run)
        # Lives here so prereqs (git, cargo, ffmpeg) are installed by
        # the matrix-level apt/brew steps above. Exercises the script
        # against both ubuntu-24.04 and macos-14 every PR.
        run: bash tests/install/smoke.sh

      - name: install_cloning.sh smoke (dry-run, macOS only)
        # The cloning installer is macOS arm64 only for now (item 2.1.1
        # ports Linux). Dry-run exercises platform detection + step
        # ordering + TOML marker write without doing the 3 GB real install.
        if: runner.os == 'macOS'
        run: bash tests/install/install_cloning_smoke.sh

      - name: clone_voice.sh smoke (dry-run)
        # Stages a fake INSTALLED.toml + a tiny source, dry-runs the
        # clone recipe, asserts step labels + invalid-name + missing-
        # source error paths. Runs on both OSes (the recipe itself is
        # platform-agnostic; only the cloning *runtime* is macOS-only).
        run: bash tests/install/clone_voice_smoke.sh

      - name: install_cloning.sh bails cleanly on Linux
        # On Linux it must exit non-zero with a clear message; the
        # smoke test asserts the bail branch.
        if: runner.os == 'Linux'
        env:
          VOICEFORGE_INSTALL_CLONING_DRY_RUN: "1"
          VOICEFORGE_HOME: /tmp/vf-ic-linux-test
        run: |
          set +e
          out="$(bash scripts/install_cloning.sh 2>&1)"
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" -eq 0 ]; then
            echo "FAIL: expected non-zero exit on Linux"
            exit 1
          fi
          echo "$out" | grep -q "macOS arm64 only" \
            || { echo "FAIL: missing platform-bail message"; exit 1; }
          echo "OK: bailed cleanly on Linux"
